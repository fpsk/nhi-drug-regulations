  reference_annotations:
    original_clause: '8.2.19. Danicopan (如Voydeya)、iptacopan (如Fabhalta): (115/3/1、115/9/1)'
    full_text: '限用於經衛生福利部國民健康署認定之陣發性夜間血紅素尿症病人，並經特殊專案審查核准後使用，且符合下列條件：(115/3/1、115/9/1)

      (1)Danicopan限與eculizumab或ravulizumab併用；iptacopan限單用。(115/3/1、115/9/1)

      (2)年齡18歲以上。

      (3)經C5補體抑制劑(如eculizumab或ravulizumab)治療後，仍出現血管外溶血(clinically significant extravascular
      hemolysis)。

      (4)使用C5抑制劑下血紅素仍小於或等於9.5g/dL。

      (5)絕對網狀紅血球計數大於或等於120×109/L，或網狀紅血球比例大於或等於3%。

      2.排除有高危險之骨髓化生不良症候群（RAEB-1或RAEB-2）。

      3.每6個月須經特殊專案審查重新評估治療結果。若符合下列條件之一，則不予同意使用。

      (1)接受治療的患者用藥後病情沒有改善者（LDH超過正常值上限的1.5倍或最近3個月內輸血多於2個單位）。

      (2)PNH granulocyte clone size ≦50%。

      (3)發生嚴重再生不良性貧血者，其檢查結果符合下列兩項或兩項以上者：

      i.中性白血球數目(neutrophil count) <0.5x109/L。

      ii.血小板數目( platelet count) <20x109/L。

      iii.網狀細胞(reticulocytes) <25x109/L。

      iv.骨髓內造血細胞密度<30%。

      4.Danicopan、iptacopan兩者僅得擇一使用，惟病人出現耐受不良反應時方可轉換使用，且限轉換一次。(115/9/1)'

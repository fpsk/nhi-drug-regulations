  reference_annotations:
    original_clause: 8.2.4.6.2. Spesolimab (如 Spevigo) (113/7/1)：用於全身型急性發作膿疱性乾癬治療部分
    full_text: '1.限皮膚科專科醫師及風濕免疫科專科醫師使用。

      2.經確診為具有IL36RN突變之全身型急性膿疱性乾癬，且符合以下所有條件者：

      (1)中重度之GPP(GPPGA 總分≥ 3且GPPGA膿疱項目分數≥ 2)。

      (2)伴有膿疱之紅腫部位侵犯體表面積>10%。

      3.需經事前審查核准後使用，申請時需檢附所有病灶照片及IL36RN檢測報告，每次申請參考仿單建議劑量，以一次給予900毫克為原則。

      4.若於給予初始劑量的1週後急性發作症狀持續（GPPGA 總分≥2 且 GPPGA 單項膿疱評分≥2），可再給予額外一劑900毫克。

      5.需檢附IL36RN突變檢測報告，且需符合全民健康保險藥品給付規定之通則十二。'

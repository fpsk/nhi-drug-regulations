    laboratory_criteria: []
    summary: 規範【. Ofloxacin (如Tarivid Otic Solution)：】之健保給付條件。 規範重點：1.有耳膜穿孔之急慢性中耳炎病患，每次處方以一瓶(十日)為原則。

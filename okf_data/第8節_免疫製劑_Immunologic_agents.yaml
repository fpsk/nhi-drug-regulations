    original_clause: 8.2.3.1. Interferon beta-la (如Rebif) 、teriflunomide 14mg (如Aubagio)、
      dimethyl fumarate (如Tecfidera)、peginterferon beta-1a (如Plegridy)、ozanimod (如Zeposia)、cladribine(如Mavenclad)：(91/4/1、97/8/1、100/10/1、106/10/1、107/7/1、107/10/1、109/11/1、112/3/1、115/3/1)
    full_text: "1.限用於復發型多發性硬化症。\n2.初次使用teriflunomide、dimethyl fumarate、peginterferon\
      \ beta-1a、ozanimod及cladribine時需經事前審查核准後使用(109/11/1、112/3/1、115/3/1)。\n3.不適用於視神經脊髓炎（neuromyelitis\
      \ optica, NMO），包括：(100/10/1)\n(1)有視神經及脊髓發作。\n(2)出現下列2種以上症狀：\ni.脊髓侵犯大於 3 節。\n\
      ii. NMO-IgG or Aquaporin-4 抗體陽性。\niii.\t腦部磁振造影不符合多發性硬化症診斷標準。\n4.Ozanimod每日限用1粒，若治療無效，第二線治療藥物不得使用fingolimod。(112/3/1)\n\
      5.Cladribine不適用EDSS(Expanded Disabi1ity Status Scale)大於5.5之病人。首次申請限給付兩年，且須符合下列任一條件：(115/3/1)\n\
      (1)未使用DMT (disease-modifying therapies)藥物，但前一年有兩次發作，且MRI檢查至少有T1-gadolinium enhancing病灶或T2病灶惡化。\n\
      (2)使用其他DMT藥物後，一年仍有一次復發且經MRI檢查確認疾病活躍。\n(3)滿四年後若有復發或核磁共振上出現疾病活性可再次申請。\n6.Interferon\
      \ beta-la、teriflunomide 14mg、dimethyl fumarate、peginterferon beta-1a、ozanimod及cladribine不得合併使用。(112/3/1、115/3/1)"

    full_text: '2.限用於下列癌瘤病患「限interferon alpha-2a（如Roferon-A）及interferon alpha-2b（如Intron
      A）」（93/4/1、97/8/1、111/2/1）:

      (1)Chronic myelogenous leukemia

      (2)Multiple myeloma

      (3)Hairy cell leukemia

      (4)Ｔ細胞淋巴瘤病例(限a-2A、2B type) (87/4/1)。

      (5)卡波西氏肉瘤（Kaposi’s sarcoma）病例使用（87/4/1）。

      (6) 70歲以下，罹患中、晚期之低度非何杰金氏淋巴瘤(low grade non-Hodgkin’s lymphoma)，且具有高腫瘤負荷(high
      tumor burden)之病患。(89/1/1、111/2/1)

      (「高腫瘤負荷」定義：第三或第四期病患；或血清LDH > 350 IU/L；或腫塊大於十公分以上。)

      (7)限使用於晚期不能手術切除或轉移性腎細胞癌之病患(限a-2A type)（89/1/1）

      (8)kasabach-Merritt症候群。（93/4/1）

      (9)用於一般療法無法治療的Lymphangioma。（93/4/1、97/8/1）'

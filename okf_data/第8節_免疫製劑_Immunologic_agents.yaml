  reference_annotations:
    original_clause: 8.2.13. Belimumab(如Benlysta)：(111/10/1、114/2/1)
    full_text: '1.用於接受標準治療至少6個月但仍然無法有效控制疾病的第Ⅲ、IV或V型狼瘡腎炎成人病人。

      (1)需經事前審查核准後使用。

      (2)標準治療係指同時使用以下藥物

      Ⅰ.類固醇治療6個月，其中至少有2個月之月平均達標準目標劑量(如口服Prednisolone ≥ 每日劑量每公斤0.5mg或等劑量之類固醇藥物)。(114/2/1)

      Ⅱ.使用足量前導治療(induction phase)免疫抑制劑，含6個月的mycophenolate mofetil(每日劑量2gm)或mycophenolic
      acid(每日劑量1,440mg)、或注射型的cyclophosphamide(注射量12週內總劑量需達3gm)接續3個月的mycophenolate
      mofetil(每日劑量2gm)或mycophenolic acid(每日劑量1,440mg)或azathioprine (每日劑量每公斤2mg)。

      Ⅲ.若因藥物毒性無法忍受，以致於無法達到前述要求時，劑量可以酌情降低，但需說明藥物之何種毒性或副作用。(114/2/1)

      (3)無法有效控制疾病的定義為經標準治療至少6個月後仍有以下情形:

      Ⅰ.蛋白尿相較基期下降比例<50%，且uPCR或24小時蛋白尿 ≥ 1.0。

      Ⅱ.腎絲球過濾率(glomerular filtration rate, GFR)下降超過20%以上且伴隨uPCR或24小時蛋白尿≥ 1.0或是出現尿沉渣。

      (4)療效評估與繼續使用:每治療12個月需評估病人在使用期間內是否達充分改善腎臟指標，必須達到以下標準才可以繼續使用:

      Ⅰ. uPCR或24小時蛋白尿≤ 0.7gm/天或相較於基期下降一半以上。(111/10/1、114/2/1)

      Ⅱ.腎絲球過濾率 (glomerular filtration rate, GFR)沒有下降超過 20%以上。

      Ⅲ.沒有末期腎臟病。

      Ⅳ.相較基期，血清肌酸酐沒有增加超過1倍。

      Ⅴ.治療2年後，若腎炎已達完全緩解者(complete renal response, CRR)，應停止使用belimumab。CRR指病人uPCR<0.5且eGFR下降與基期相比<10%或持續≥90
      ml/min/1.73m2。'

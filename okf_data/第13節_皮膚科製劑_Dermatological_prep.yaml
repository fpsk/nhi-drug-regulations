    - Tacrolimus (如 Protopic Ointment)
  conditions_of_payment:
    indications:
    - Atopic Dermatitis (異位性皮膚炎)
    laboratory_criteria: []
    summary: 適用於【Atopic Dermatitis】之健保給付。 規範重點：限2歲以上因為潛在危險而不宜使用其他傳統治療、或對其他傳統治療反應不充分、或無法耐受其他傳統治療且患部面積>30%之中、重度異位性皮膚炎之下列病患第二線使用(95/7/1、111/2/1)
      1.成人患部面積30%~50%，每星期不超過30gm；患部面積>50%，每星期不超過60gm。
    clinical_rules:
    - indication: Atopic Dermatitis (異位性皮膚炎)
      biomarkers: []
      prior_authorization: false
      step_therapy: []
      stopping_rules: []
      evaluation_frequency:
      - 使用一個月
    structured_biomarkers: []
    prior_authorization_required: false
    prior_authorization_grounding: null
    step_therapy: []
    stopping_rules: []
    evaluation_intervals:
    - 使用一個月
  reference_annotations:
    original_clause: 13.10. Tacrolimus (如Protopic Ointment )：(91/12/1、93/8/1、95/7/1、99/12/1、111/2/1)
    full_text: '限2歲以上因為潛在危險而不宜使用其他傳統治療、或對其他傳統治療反應不充分、或無法耐受其他傳統治療且患部面積>30%之中、重度異位性皮膚炎之下列病患第二線使用(95/7/1、111/2/1)

      1.成人患部面積30%~50%，每星期不超過30gm；患部面積>50%，每星期不超過60gm。(99/12/1)

      2.孩童患部面積30%~50%，每兩星期不超過30gm；患部面積>50%，每星期不超過30gm。(99/12/1)

      3.面積計算：成人依照 rule of nines(詳備註1)，由部位乘予大約比例之總和，兒童依比例 (備註2，Barkin公式) 修訂。

      4.使用一個月後，症狀若無改善，應改用其他藥物治療。

      5.以三個月為一個療程，作間歇性長期治療者，若需繼續治療，每月限使用30公克。（93/8 /1）

      6.不可合併紫外線治療。（93/8 /1）

      7.與pimecrolimus併用時 (99/12/1)：

      (1)成人：患部面積30%~50%，每星期兩者合併用量不超過30gm；患部面積>50%，兩者每星期合併用量不超過60gm。

      (2)孩童：患部面積30%~50%，每兩星期兩者合併用量不超過30gm；患部面積>50%，每星期兩者合併用量不超過30gm。

      (3)若因病情需要兩者合併使用量需超過限制者，應於病歷詳細記錄理由。

      備註1：Rule of nines計算法：頭頸9%，兩上肢18%，軀幹18%，背18%，兩下肢36%，陰部1%。

      備註2：兒童患部面積計算如附表十七 (From Roger M. Barkin)'

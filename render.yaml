services:
  - type: web
    name: nhi-drug-regulations-fpsk
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ADMIN_PASSWORD
        value: nhi2026

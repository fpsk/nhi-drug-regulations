  reference_annotations:
    original_clause: 8.2.3.7. Siponimod(如Mayzent)：(110/3/1)
    full_text: "1.\t限用於曾被診斷為復發緩解型多發性硬化症之病人。\n2.\t須符合次發進展型多發性硬化症之診斷，即過去在沒有復發或與復發無關的情況下，出現失能惡化持續至少6個月以上。\n\
      3.\t初次接受siponimod時，EDSS應小於或等於6.5分，且EDSS大於等於3分。\n4.\t初次接受siponimod之前2年內，需有明顯EDSS進展性惡化之證據，亦即符合以下二者其中之一：\n\
      (1)申請時EDSS未滿6分者，過去2年內EDSS惡化1分以上。\n(2)申請時EDSS大於等於6分者，過去2年內EDSS惡化0.5分以上。\n5.\t\
      須經事前審查核准後使用，每年需重新申請，併應提出整個用藥期間之EDSS分數(包括起始用藥EDSS分數與每年申請時EDSS分數)\n6.\tSiponimod使用2年後，EDSS出現確認失能惡化持續6個月(6-month\
      \ confirmed disability progression)時，亦即EDSS未滿6分者，2年內惡化1分以上，EDSS大於等於6分者，2年內惡化0.5分以上，應停止本藥品之治療。\n\
      7.\t依治療建議劑量，從0.25mg每天1次起始，達到2mg每天1次之維持劑量，且不得以8粒0.25mg取代1粒2mg。"

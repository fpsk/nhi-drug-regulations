    full_text: "1.限用於雖已接受乙型干擾素或 glatiramer 治療，相較於前一年度復發率仍不變或反而上升之高度活躍型復發緩解之多發性硬化症病人(highly\
      \ active relapsing– remitting multiple sclerosis即前一年有一次以上復發或是前兩年有兩次以上復發)，但排除使用於：\n\
      (1)EDSS (Expanded Disabi1ity Status Scale)大於5.5之患者。\n(2)視神經脊髓炎(neuromyelitis\
      \ optica,NMO)，包括：\nI. 有視神經及脊髓發作。\nII.出現下列2種以上症狀：\ni. 脊髓侵犯大於3節；\nii. \tNMO-IgG\
      \ or Aquaporin-4 抗體陽性；\niii.腦部磁振造影不符合多發性硬化症診斷標準。\n2. 須經事前審查核准後使用，每年需重新申請，併應提出整個用藥期間的復發情形。(102/10/1)\n\
      3. Fingolimod使用兩年後，年度復發率(average annual relapse)無法減少※時應停止本藥品之治療。(102/10/1、109/1/1)\n\
      註：年度復發率無法減少之定義為： 採計使用fingolimod藥物後一年至兩年復發次數之數據 (以最近一年或兩年之復發次數除以1或2來計算)，較諸更先前一年或兩年之年復發率皆無再減少時。(102/10/1)\n\
      4.個案在停藥觀察期間復發且為高度活躍型復發緩解之多發性硬化症病人(highly active relapsing–remitting multiple\
      \ sclerosis)可再申請並經事前審查核准後使用。(102/10/1)"

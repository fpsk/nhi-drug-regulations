<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣健保藥物給付規定查詢</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="shared.css?v=5">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-prescription-bottle-medical logo-icon"></i>
            <div>
                <h1 style="font-size: 1.5rem; font-weight: 700; color: #f8fafc;">台灣健保藥物給付規定查詢</h1>
                <p id="appVersionSubtitle" class="subtitle" style="color: #38bdf8; font-weight: 600; margin-top: 0.15rem; font-size: 0.9rem;">2026年8月更新 (573 條規定)</p>
            </div>
        </div>
        <div class="nav-actions">
            <button id="uploadBtn" class="btn btn-primary">
                <i class="fa-solid fa-lock"></i> 更新法規文件 (需密碼驗證)
            </button>
        </div>
    </header>

    <main class="container">
        <!-- Search Section -->
        <section class="search-hero">
            <div class="search-box-wrapper">
                <div class="search-input-group">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="輸入藥品、適應症、檢驗值或條號，多條件請以逗號「,」分隔（例：Forxiga, 心衰竭, eGFR）" autocomplete="off">
                    <button id="clearSearch" class="btn-clear"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div style="font-size: 0.82rem; color: #94a3b8; margin-top: 0.5rem; padding-left: 0.25rem; text-align: left;">
                    <i class="fa-solid fa-circle-info" style="color: #38bdf8;"></i> 提示：可同時搜尋藥品與臨床條件（順序不拘），請以逗號 <code>,</code> 分隔，例如：<code>Forxiga, 心衰竭</code> 或 <code>肺癌, EGFR, 事前審查</code>
                </div>
            </div>

            <!-- ATC Expansion Badge -->
            <div id="atcExpansion" class="atc-expansion-bar hidden">
                <div class="atc-badge-title"><i class="fa-solid fa-diagram-project"></i> ATC 藥理類別自動擴充：</div>
                <div id="atcTags" class="atc-tags"></div>
            </div>

            <!-- Filter Controls -->
            <div class="filter-bar">
                <div class="filter-item">
                    <label><i class="fa-solid fa-layer-group"></i> 給付章節 (Chapter):</label>
                    <select id="chapterFilter">
                        <option value="">全部章節 (All Chapters)</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label><i class="fa-solid fa-vial-circle-check"></i> 臨床指標 / 審查 (Clinical Criteria):</label>
                    <select id="labFilter">
                        <option value="">全部指標與審查條件 (All Criteria)</option>
                        <optgroup label="審查條件 (Authorization)">
                            <option value="PRIOR_AUTH">需事前審查 (Prior Authorization Required)</option>
                        </optgroup>
                        <optgroup label="代謝、腎肝與心血管指標 (Metabolic / Renal / CV)">
                            <option value="HbA1c">HbA1c (糖化血色素)</option>
                            <option value="eGFR">eGFR (腎絲球過濾率)</option>
                            <option value="LDL-C">LDL-C (低密度脂蛋白膽固醇)</option>
                            <option value="LVEF">LVEF (左心室射出分率)</option>
                            <option value="BNP/NT-proBNP">BNP / NT-proBNP (心衰竭指標)</option>
                            <option value="UACR">UACR / UPCR (尿蛋白比值)</option>
                            <option value="ALT">ALT / AST (肝功能轉胺酶)</option>
                            <option value="Scr">Scr (血清肌酸酐)</option>
                            <option value="Child-Pugh">Child-Pugh (肝硬化分級)</option>
                            <option value="BMI">BMI (身體質量指數)</option>
                        </optgroup>
                        <optgroup label="腫瘤與基因生物標記 (Oncology Biomarkers)">
                            <option value="PD-L1">PD-L1 (免疫檢查點表現量)</option>
                            <option value="EGFR">EGFR (表皮生長因子受體突變)</option>
                            <option value="HER2">HER2 (人類表皮生長因子受體2)</option>
                            <option value="ALK">ALK (間變性淋巴瘤激酶)</option>
                            <option value="BRCA">BRCA 1/2 (同源重組修復基因)</option>
                            <option value="BRAF">BRAF / KRAS / ROS1</option>
                            <option value="ECOG">ECOG (體能狀態評分)</option>
                            <option value="PSA">PSA / AFP (腫瘤標記)</option>
                        </optgroup>
                        <optgroup label="免疫風濕、神經與骨質評估量表 (Clinical Scales)">
                            <option value="DAS28">DAS28 (類風濕性關節炎活動度)</option>
                            <option value="PASI">PASI / EASI (乾癬 / 異位性皮膚炎量表)</option>
                            <option value="BASDAI">BASDAI (僵直性脊椎炎量表)</option>
                            <option value="EDSS">EDSS (多發性硬化症失能量表)</option>
                            <option value="MMSE">MMSE / CDR (認知功能量表)</option>
                            <option value="DEXA/BMD">DEXA / BMD (骨質密度 T-score)</option>
                        </optgroup>
                        <optgroup label="病毒量與血液學指標 (Virology / Hematology)">
                            <option value="HBV DNA">HBV DNA / HBsAg (B肝病毒指標)</option>
                            <option value="HCV RNA">HCV RNA (C肝病毒指標)</option>
                            <option value="Hb">Hb (血紅素)</option>
                            <option value="ANC">ANC / 白血球 (嗜中性白血球)</option>
                            <option value="Platelet">Platelet / 血小板</option>
                        </optgroup>
                    </select>
                </div>
                <div class="stats-counter" id="statsCounter">
                    載入中...
                </div>
            </div>
        </section>

        <!-- Results Grid -->
        <section class="results-container">
            <div id="top6Banner" class="top6-banner hidden"></div>
            <div id="resultsGrid" class="results-grid">
                <!-- Cards injected dynamically -->
            </div>
            
            <!-- Load More Container -->
            <div id="loadMoreContainer" class="load-more-container hidden">
                <button id="loadMoreBtn" class="btn btn-secondary btn-load-more">
                    <i class="fa-solid fa-angles-down"></i> 顯示更多給付規定 (Load More)
                </button>
            </div>

            <div id="noResults" class="no-results hidden">
                <i class="fa-solid fa-box-open"></i>
                <h3>未找到符合條件的給付規定</h3>
                <p>請嘗試調整搜尋關鍵字或清除篩選條件。</p>
            </div>
        </section>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <span id="modalSecBadge" class="sec-badge"></span>
                    <h2 id="modalTitle">給付規定詳情</h2>
                </div>
                <button id="closeModal" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div>
                    <div class="meta-section">
                        <div class="meta-box">
                            <strong><i class="fa-solid fa-folder"></i> 歸屬章節：</strong>
                            <span id="modalChapter"></span>
                        </div>
                        <div class="meta-box">
                            <strong><i class="fa-regular fa-calendar-days"></i> 修訂發布日期：</strong>
                            <span id="modalDates"></span>
                        </div>
                        <div id="modalDrugsBox" class="meta-box hidden" style="grid-column: 1 / -1;">
                            <strong><i class="fa-solid fa-pills" style="color: #38bdf8;"></i> 涵蓋藥品 / 成分：</strong>
                            <span id="modalDrugsList" style="color: #e2e8f0; font-weight: 500;"></span>
                        </div>
                    </div>
                    <div id="modalStructuredCriteriaSection" class="structured-criteria-section hidden">
                        <div class="structured-criteria-header">
                            <span><i class="fa-solid fa-microscope"></i> 結構化臨床核對門檻 (點擊可高亮原始條文)</span>
                            <span id="modalPriorAuthBadge"></span>
                        </div>
                        <div id="modalStructuredChips" class="criteria-chip-list"></div>
                    </div>
                    <div class="annotated-text-box">
                        <h4><i class="fa-solid fa-quote-left"></i> 原始條文內文 (與給付條件標註)</h4>
                        <div id="modalFullText" class="full-text"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal-backdrop hidden">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h2><i class="fa-solid fa-lock"></i> 更新健保給付規定 (密碼驗證)</h2>
                <button id="closeUploadModal" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="uploadForm">
                    <div class="drop-zone" id="dropZone">
                        <i class="fa-solid fa-file-word drop-icon"></i>
                        <p>將最新給付規定 <strong>.docx</strong> 或 <strong>.pdf</strong> 檔案拖曳至此</p>
                        <span>或點擊選擇檔案</span>
                        <input type="file" id="fileInput" accept=".docx,.pdf" required hidden>
                    </div>
                    <div id="fileSelected" class="file-selected hidden">
                        <i class="fa-solid fa-file-lines"></i> <span id="selectedFileName"></span>
                    </div>
                    <div style="margin-bottom: 1.25rem;">
                        <label style="display: block; font-size: 0.88rem; color: #94a3b8; margin-bottom: 0.4rem;">
                            <i class="fa-solid fa-key" style="color: #38bdf8;"></i> 管理員驗證密碼 (Admin Password):
                        </label>
                        <input type="password" id="uploadPassword" placeholder="預設密碼為 nhi2026" required style="width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: white; outline: none; font-size: 0.95rem;">
                    </div>
                    <div id="uploadStatus" class="upload-status"></div>
                    <button type="submit" class="btn btn-primary btn-block" id="startUploadBtn">
                        驗證密碼並自動更新知識庫
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="shared.js?v=14"></script>
    <script src="app.js?v=14"></script>
</body>
</html>

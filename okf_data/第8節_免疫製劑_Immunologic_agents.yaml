    original_clause: 8.2.4.12. Tocilizumab(如Actemra)：(113/1/1)
    full_text: '1.用於新型冠狀病毒疾病，需同時符合下述所有條件：

      (1)住院成年病人。

      (2)與dexamethasone合併使用於嚴重肺炎以上(未使用吸氧治療下SpO2 ≦94%；需使用吸氧治療、高流量氧氣或非侵襲性呼吸器、使用機械式呼吸器或使用體外膜氧合器葉克膜/ECMO)之患者。或與dexamethasone及remdesivir合併用於未使用吸氧治療下SpO2≦
      94%、需使用吸氧治療、高流量氧氣或非侵襲性呼吸器之患者。

      2.劑量8mg/kg，單次靜脈注射，最大劑量800mg。'

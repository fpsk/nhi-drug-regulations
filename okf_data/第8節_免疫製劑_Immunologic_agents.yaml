    original_clause: 8.2.8. Palivizumab (如Synagis)(99/12/1、102/7/1、106/4/1、111/2/1、111/4/1、114/6/1)
    full_text: '限符合下列條件之一：

      1.出生時，懷孕週數未滿33週之早產兒，最多施打六劑。懷孕週數滿33週但未滿36週之早產兒，最多施打三劑。(106/4/1、111/2/1、111/4/1、114/6/1)

      2.併有慢性肺疾病(Chronic Lung Disease；CLD)之早產兒(35週以下)(111/2/1)。

      3.1歲以下患有血液動力學上顯著異常之先天性心臟病童。需符合以下條件(111/2/1)：

      (1)納入條件：符合下列條件之一

      Ⅰ非發紺性先天性心臟病合併心臟衰竭：符合下列三項中至少兩項：(1)生長遲滯，體重小於第三百分位；(2)有明顯心臟擴大現象；(3)需兩種以上抗心臟衰竭藥物控制症狀。

      Ⅱ發紺性先天性心臟病：完全矯正手術（含心導管或是外科手術矯正）前或是矯正手術後仍有發紺或是心臟衰竭症狀者。

      (2)排除條件：

      Ⅰ非嚴重性先天性心臟病：不需藥物控制心臟衰竭，如心房中隔缺損，單純動脈瓣膜輕微狹窄等。

      Ⅱ嚴重性先天性心臟病，但經心導管或外科手術治療，目前僅殘存輕微血行動力學異常，且無發紺症狀。

      (3)施打方式：

      Ⅰ一歲之內每個月給予15mg/kg palivizumab肌肉注射一次，直到年齡滿一歲或直到矯正手術(包括開心及心導管手術)為止。

      Ⅱ一歲之內接受體外循環開心矯正手術者，術後出院前再給一劑。

      Ⅲ最多施打六劑。'

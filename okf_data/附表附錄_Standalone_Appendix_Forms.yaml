    full_text: '治療川崎病(KawasakiDisease)申請表

      臨床症狀

      □發燒五天或五天以上

      且合併下列五項臨床症狀中至少四項：

      □肢端病變：急性期手掌足底變紅、腫

      恢復期從指（趾）尖開始脫皮

      □多行性皮疹

      □兩眼眼球結膜充血(bulbarconjunctiva)

      □嘴唇及口腔的變化：紅唇、乾裂或草莓舌或咽喉泛紅

      □頸部淋巴腺腫

      B.實驗檢查數值

      紅血球沉降速率(ESR)　　　　　　C-反應蛋白

      血色素(血比容)　　　　　　　　　　血小板

      C.□只符合三項臨床症狀，但心臟超音波有冠狀動脈病變

      請注意是否有下列疾病再使用

      附註

      川崎病診斷標準請參考IVIG使用規定

      IVIG限

      1.區域醫院(含)以上教學醫院使用，或

      2. 具有小兒心臟醫師證書之小兒科醫師，

      並有小兒心臟超音波儀器之醫院實施。

      IVIG限病發十天內使用

      申請醫師　　　　　　　醫事機構章戳'

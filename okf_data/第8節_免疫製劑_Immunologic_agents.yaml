  reference_annotations:
    original_clause: '8.2.3.4. Natalizumab (如Tysabri) （100/5/1）:'
    full_text: '1.限用於interferon-beta 或 glatiramer 治療無效之復發型多發性硬化症病人。

      2.前述治療無效定義，係指患者臨床上每年有2次（含）以上的失能發作，且併下列條件之一：

      (1)磁振攝影（MRI）影像的T2增強訊號病灶明顯增加。

      (2)至少出現1 個釓增強病灶(gadolinium-enhancing lesions)。

      3.病患若為眼神經脊髓炎(neuromyelitis optica)或曾經有脊髓發作超過三節或三節(≧3 vertebral bodies) 以上者，不得使用。

      4.僅限於「多發性硬化症擴展殘疾狀況評分表」（Expanded Disability Status Scale；EDSS）小於5.5者使用。

      5.須經事前審查核准後使用，每年須重新申請，排除眼神經脊髓炎(neuromyelitis optica)病患。處方醫師應事先告知病患，使用本案藥品無法完全排除發生「進行性多灶性白質腦病」(Progressive
      multifocal leukoencephalopathy；PML)之副作用，PML致死率高，且臨床上不易處理。'
